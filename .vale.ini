# This file records the retired URL that the rule forbids elsewhere.
[copy/urls.md]
Portolan-Terms.Urls = NO

# "hold the copyright" is the legal term for copyright ownership. Keep it
# exact. An inline `<!-- vale ai-tells.BareHolds = NO -->` does not work,
# because vale applies a comment toggle to a local style but not to a rule
# from a package.
[policies/AI_POLICY.md]
ai-tells.BareHolds = NO

# Vendored, generated, or machine-written text.
[**/{node_modules,.venv,venv,vendor,site-packages,worktrees,.git}/**]
BasedOnStyles =

[.claude/**]
BasedOnStyles =

[{audits,brand/fonts}/**]
BasedOnStyles =

# The Contributor Covenant, reproduced verbatim. Do not restyle it.
[**/CODE_OF_CONDUCT.md]
BasedOnStyles =

# Slide decks. The frontmatter parses as headings.
[**/slides.md]
BasedOnStyles =

[**/.pytest_cache/**]
BasedOnStyles =

[**/docs/reference/**]
BasedOnStyles =

[**/{LICENSE,LICENCE,COPYING,NOTICE,CHANGELOG,conformance}*.{md,mdx}]
BasedOnStyles =
