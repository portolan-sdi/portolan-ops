# Website voice. scripts/vale_messages.py extracts messages/en.json here.
[.vale-web/*.md]
BasedOnStyles = Vale, Portolan-Terms, Portolan-Mechanics, Portolan-Voice, Portolan-Web, ai-tells
Vale.Spelling = NO
TokenIgnores = (`[^`]+`), ([\w.-]+/[\w.-]+), ([a-z0-9]+(?:-[a-z0-9]+)+)

