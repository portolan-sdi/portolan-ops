# Portolan prose rules. Canonical home: portolan-sdi/portolan-ops.
#
# Three layers apply to every prose file:
#   Portolan-Terms      the project lexicon, from copy/messaging.md
#   Portolan-Mechanics  punctuation, capitalization, spacing
#   Portolan-Voice      the voice rules all surfaces share
#
# One surface style applies per path: Docs, Blog, or Web.
#
# The ai-tells package adds the rules norms/prose.md states but the Portolan
# styles cannot match: figurative language, hype words, and filler. Six of its
# rules are off. Each disable below states the reason.
# Vale replaces BasedOnStyles on the most specific matching glob rather
# than merging it, so every section names each style it needs.
#
# See norms/prose.md.

StylesPath = styles
MinAlertLevel = suggestion

# A term listed in styles/config/vocabularies/Portolan/accept.txt is skipped
# by every other check. Keep a word out of accept.txt when a rule must match
# on it.
Vocab = Portolan
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip, https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip, https://github.com/vale-cli/readability/releases/download/v0.1.1/Readability.zip, https://github.com/tbhb/vale-ai-tells/releases/download/v1.33.0/ai-tells.zip

# Docs voice. READMEs, docs pages, and specifications.
[*.{md,mdx}]
BasedOnStyles = Vale, Portolan-Terms, Portolan-Mechanics, Portolan-Voice, Portolan-Docs, Google, Microsoft, Readability, ai-tells

Vale.Spelling = NO
TokenIgnores = (`[^`]+`), ([\w.-]+/[\w.-]+), ([a-z0-9]+(?:-[a-z0-9]+)+)
# scripts/build_agents_block.py wraps the canonical AGENTS.md in ops-sync
# markers. A downstream repo cannot fix that text, so report only the prose it
# owns. The canonical file here carries no markers and stays checked in full.
BlockIgnores = (?s)<claude-mem-context>.*?</claude-mem-context>, (?s)<!-- ops-sync:begin.*?<!-- ops-sync:end -->

# Google rules that fight the Portolan voice or duplicate a Portolan rule.
Google.We = NO
Google.Contractions = NO
Google.WordList = NO
Google.Headings = NO
Google.Parens = NO
Google.Quotes = NO
Google.Acronyms = NO
Google.Colons = NO
Google.Passive = NO
Google.OxfordComma = NO
Google.Ellipses = NO
# Portolan-Mechanics.EmDash owns the em dash. Portolan spaces it; Google does not.
Google.EmDash = NO
# Reports 'supply-chain', which is a correct compound adjective.
Google.LyHyphens = NO

# Keep Microsoft checks that add distinct editorial value. These checks either
# conflict with local conventions, duplicate a Portolan rule, or produce
# domain-specific false positives, such as "agent" as a deprecated term.
Microsoft.Contractions = NO
Microsoft.Auto = NO
Microsoft.Dashes = NO
Microsoft.Ellipses = NO
Microsoft.FirstPerson = NO
Microsoft.GeneralURL = NO
Microsoft.HeadingColons = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Headings = NO
Microsoft.OxfordComma = NO
Microsoft.Passive = NO
Microsoft.Quotes = NO
Microsoft.Semicolon = NO
Microsoft.SentenceLength = NO
Microsoft.Terms = NO
Microsoft.Uppercase = NO
Microsoft.Vocab = NO

# ARI and Flesch Reading Ease are enough to show a trend. Their targets remain
# suggestions because technical names unavoidably raise prose scores.
Readability.ColemanLiau = NO
Readability.FleschKincaid = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO

# ai-tells rules that conflict with a rule this repo already owns, or that
# report an exact technical word.
#
# It bans the em dash. Portolan-Mechanics.EmDash requires a spaced em dash and
# limits the count per file. Keep one owner.
ai-tells.EmDashUsage = NO
# This repo sets Google.Semicolons to warning on purpose. Keep one rule for
# the semicolon.
ai-tells.SemicolonUsage = NO
# Its message gives the contraction "doesn't" as the fix. Google.Contractions
# is off here, and Simplified Technical English allows only full verb forms.
ai-tells.NegatedObject = NO
# It reports "implements". Every repo states that a tool implements the
# specification, and portolan-spec is ground truth. The word is exact.
ai-tells.FormalRegister = NO
# It reports a run-in bold label, such as "**Note:** ...", which the docs use
# to open a paragraph. vale-ai-tells turns it off in its own repository.
ai-tells.ColonUsage = NO
# Every match is a CLI flag inside a code span, such as `portolan check --fix`.
# vale masks a code span before it matches, but a punctuation token still
# reports at the raw position inside the mask. tbhb/vale-ai-tells records the
# limitation in its TODO.md.
ai-tells.DoubleHyphen = NO

# Blog voice. Longer sentences are allowed.
[src/content/blog/*.mdx]
BasedOnStyles = Vale, Portolan-Terms, Portolan-Mechanics, Portolan-Voice, Portolan-Blog, ai-tells
Vale.Spelling = NO
TokenIgnores = (`[^`]+`), ([\w.-]+/[\w.-]+), ([a-z0-9]+(?:-[a-z0-9]+)+)

