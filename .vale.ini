# Portolan prose rules. Canonical home: portolan-sdi/portolan-ops.
#
# Three layers apply to every prose file:
#   Portolan-Terms      the project lexicon, from copy/messaging.md
#   Portolan-Mechanics  punctuation, capitalization, spacing
#   Portolan-Voice      the voice rules all surfaces share
#
# One surface style applies per path: Docs, Blog, or Web.
# Vale replaces BasedOnStyles on the most specific matching glob rather
# than merging it, so every section names each style it needs.
#
# See norms/prose.md.

StylesPath = styles
MinAlertLevel = suggestion

# A term listed in styles/config/vocabularies/Portolan/accept.txt is skipped
# by every other check. Keep a word out of accept.txt when a rule must match
# on it.
Vocab = Portolan
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip, https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip, https://github.com/vale-cli/readability/releases/download/v0.1.1/Readability.zip

# Docs voice. READMEs, docs pages, and specifications.
[*.{md,mdx}]
BasedOnStyles = Vale, Portolan-Terms, Portolan-Mechanics, Portolan-Voice, Portolan-Docs, Google, Microsoft, Readability

Vale.Spelling = NO
TokenIgnores = (`[^`]+`), ([\w.-]+/[\w.-]+), ([a-z0-9]+(?:-[a-z0-9]+)+)
BlockIgnores = (?s)<claude-mem-context>.*?</claude-mem-context>

# Google rules that fight the Portolan voice or duplicate a Portolan rule.
Google.We = NO
Google.Contractions = NO
Google.WordList = NO
Google.Headings = NO
Google.Parens = NO
Google.Quotes = NO
Google.Acronyms = NO
Google.Colons = NO
Google.Passive = NO
Google.OxfordComma = NO
Google.Ellipses = NO
# Portolan-Mechanics.EmDash owns the em dash. Portolan spaces it; Google does not.
Google.EmDash = NO
# Reports 'supply-chain', which is a correct compound adjective.
Google.LyHyphens = NO

# Keep Microsoft checks that add distinct editorial value. These checks either
# conflict with local conventions, duplicate a Portolan rule, or produce
# domain-specific false positives, such as "agent" as a deprecated term.
Microsoft.Contractions = NO
Microsoft.Auto = NO
Microsoft.Dashes = NO
Microsoft.Ellipses = NO
Microsoft.FirstPerson = NO
Microsoft.GeneralURL = NO
Microsoft.HeadingColons = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Headings = NO
Microsoft.OxfordComma = NO
Microsoft.Passive = NO
Microsoft.Quotes = NO
Microsoft.Semicolon = NO
Microsoft.SentenceLength = NO
Microsoft.Terms = NO
Microsoft.Uppercase = NO
Microsoft.Vocab = NO

# ARI and Flesch Reading Ease are enough to show a trend. Their targets remain
# suggestions because technical names unavoidably raise prose scores.
Readability.ColemanLiau = NO
Readability.FleschKincaid = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO

# Blog voice. Longer sentences are allowed.
[src/content/blog/*.mdx]
BasedOnStyles = Vale, Portolan-Terms, Portolan-Mechanics, Portolan-Voice, Portolan-Blog
Vale.Spelling = NO
TokenIgnores = (`[^`]+`), ([\w.-]+/[\w.-]+), ([a-z0-9]+(?:-[a-z0-9]+)+)

# Website voice. scripts/vale_messages.py extracts messages/en.json here.
[.vale-web/*.md]
BasedOnStyles = Vale, Portolan-Terms, Portolan-Mechanics, Portolan-Voice, Portolan-Web
Vale.Spelling = NO
TokenIgnores = (`[^`]+`), ([\w.-]+/[\w.-]+), ([a-z0-9]+(?:-[a-z0-9]+)+)

# This file records the retired URL that the rule forbids elsewhere.
[copy/urls.md]
Portolan-Terms.Urls = NO

# Vendored, generated, or machine-written text.
[**/{node_modules,.venv,venv,vendor,site-packages,worktrees,.git}/**]
BasedOnStyles =

[.claude/**]
BasedOnStyles =

[{audits,brand/fonts}/**]
BasedOnStyles =

# The Contributor Covenant, reproduced verbatim. Do not restyle it.
[**/CODE_OF_CONDUCT.md]
BasedOnStyles =

# Slide decks. The frontmatter parses as headings.
[**/slides.md]
BasedOnStyles =

[**/.pytest_cache/**]
BasedOnStyles =

[**/docs/reference/**]
BasedOnStyles =

[**/{LICENSE,LICENCE,COPYING,NOTICE,CHANGELOG,conformance}*.{md,mdx}]
BasedOnStyles =
