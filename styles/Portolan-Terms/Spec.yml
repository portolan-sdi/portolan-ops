extends: substitution
message: "Portolan is a specification. Write '%s', not '%s'."
level: error
ignorecase: false
swap:
  'Portolan standard': Portolan specification
  'Portolan Standard': Portolan specification
  'the Portolan standard': the Portolan specification
  'Portolan is a standard': Portolan is a specification
  'Portolan is an open standard': Portolan is an open specification
  'standard that defines a Portolan catalog': specification that defines a Portolan catalog
  'opinionated standard': opinionated specification
  'open standard for publishing': open specification for publishing
