# Fan-out map: which ops files go where.
#
# Each entry: src (path in this repo) -> targets [{repo, dest, mode?}].
# mode "copy" (default) replaces the dest file wholesale.
# mode "block" replaces only the delimited region between
#   "<!-- ops-sync:begin ... -->" and "<!-- ops-sync:end -->" in the dest
#   file, creating the file from the block alone when it doesn't exist.
#   Content outside the markers is never touched.
#
# scripts/sync.py consumes this file; scripts/check_manifest.py validates it.
# Adding a repo to the fan-out is one edit here.
#
# auto_merge lists repos whose sync PR arms GitHub auto-merge, so their
# own required checks decide when it lands. A repo left off the list
# waits for a human. sync skips auto-merge on any run whose PR touches
# .github/workflows/, and on any branch with no required checks. See
# norms/ci.md, "Auto-merging the sync pull request".
auto_merge:
  - portolan-sdi/portolan-spec
  - portolan-sdi/portolan-cli
  - portolan-sdi/rashid
  - portolan-sdi/portolan-registry
  - portolan-sdi/portolan-browser
  - portolan-sdi/portolan-skills
  - portolan-sdi/portolan-sdi.org
  - portolan-sdi/stac-partition-extension
  - portolan-sdi/stac-iceberg-extension
  - portolan-sdi/stac-osi-extension
  - portolan-sdi/portolan-nl-demo
  - portolan-sdi/portolan-bootstrapper

sync:
  # --- Org profile + community health files -> the .github repo.
  # GitHub applies these defaults to every org repo that lacks its own copy.
  - src: copy/org-profile/README.md
    targets:
      - repo: portolan-sdi/.github
        dest: profile/README.md

  - src: policies/CODE_OF_CONDUCT.md
    targets:
      - repo: portolan-sdi/.github
        dest: CODE_OF_CONDUCT.md

  - src: policies/CONTRIBUTING.md
    targets:
      - repo: portolan-sdi/.github
        dest: CONTRIBUTING.md

  - src: policies/SECURITY.md
    targets:
      - repo: portolan-sdi/.github
        dest: SECURITY.md

  - src: policies/AI_POLICY.md
    targets:
      - repo: portolan-sdi/.github
        dest: AI_POLICY.md

  - src: templates/PULL_REQUEST_TEMPLATE.md
    targets:
      - repo: portolan-sdi/.github
        dest: PULL_REQUEST_TEMPLATE.md

  - src: templates/ISSUE_TEMPLATE/bug_report.yml
    targets:
      - repo: portolan-sdi/.github
        dest: .github/ISSUE_TEMPLATE/bug_report.yml

  - src: templates/ISSUE_TEMPLATE/feature_request.yml
    targets:
      - repo: portolan-sdi/.github
        dest: .github/ISSUE_TEMPLATE/feature_request.yml

  - src: templates/ISSUE_TEMPLATE/task.yml
    targets:
      - repo: portolan-sdi/.github
        dest: .github/ISSUE_TEMPLATE/task.yml

  - src: templates/ISSUE_TEMPLATE/config.yml
    targets:
      - repo: portolan-sdi/.github
        dest: .github/ISSUE_TEMPLATE/config.yml

  # --- LICENSE -> every active repo that lacks it.
  # GitHub does not inherit licenses from .github.
  # portolan-browser and portolan-nl-demo are excluded pending the ISC
  # fork-license decision (norms/repos.md, "License").
  - src: LICENSE
    targets:
      - repo: portolan-sdi/portolan-skills
        dest: LICENSE
      - repo: portolan-sdi/portolan-data
        dest: LICENSE

  # --- Agent norms -> active repos.
  # AGENTS.md carries the org norms as text, not as links, because agents
  # load what a file says and do not follow URLs to find out. The block is
  # generated from ops' own AGENTS.md by scripts/build_agents_block.py.
  # Only the delimited block is managed; repo-specific content below it
  # stays untouched.
  - src: templates/repo/AGENTS.md
    mode: block
    targets:
      - repo: portolan-sdi/portolan-spec
        dest: AGENTS.md
      - repo: portolan-sdi/portolan-cli
        dest: AGENTS.md
      - repo: portolan-sdi/rashid
        dest: AGENTS.md
      - repo: portolan-sdi/portolan-registry
        dest: AGENTS.md
      - repo: portolan-sdi/portolan-browser
        dest: AGENTS.md
      - repo: portolan-sdi/portolan-skills
        dest: AGENTS.md
      - repo: portolan-sdi/portolan-sdi.org
        dest: AGENTS.md
      - repo: portolan-sdi/stac-partition-extension
        dest: AGENTS.md
      - repo: portolan-sdi/stac-iceberg-extension
        dest: AGENTS.md
      - repo: portolan-sdi/stac-osi-extension
        dest: AGENTS.md
      - repo: portolan-sdi/portolan-nl-demo
        dest: AGENTS.md
      - repo: portolan-sdi/portolan-bootstrapper
        dest: AGENTS.md

  # --- CLAUDE.md bridge -> the same repos.
  # Claude Code reads CLAUDE.md and never AGENTS.md, so without this
  # file it sees no org norms at all. The block holds one import line.
  # block mode means a repo that already has a CLAUDE.md keeps its
  # content: sync prepends the block rather than replacing the file.
  - src: templates/repo/CLAUDE.md
    mode: block
    targets:
      - repo: portolan-sdi/portolan-spec
        dest: CLAUDE.md
      - repo: portolan-sdi/portolan-cli
        dest: CLAUDE.md
      - repo: portolan-sdi/rashid
        dest: CLAUDE.md
      - repo: portolan-sdi/portolan-registry
        dest: CLAUDE.md
      - repo: portolan-sdi/portolan-browser
        dest: CLAUDE.md
      - repo: portolan-sdi/portolan-skills
        dest: CLAUDE.md
      - repo: portolan-sdi/portolan-sdi.org
        dest: CLAUDE.md
      - repo: portolan-sdi/stac-partition-extension
        dest: CLAUDE.md
      - repo: portolan-sdi/stac-iceberg-extension
        dest: CLAUDE.md
      - repo: portolan-sdi/stac-osi-extension
        dest: CLAUDE.md
      - repo: portolan-sdi/portolan-nl-demo
        dest: CLAUDE.md
      - repo: portolan-sdi/portolan-bootstrapper
        dest: CLAUDE.md

  # --- Repo checks -> every active repo.
  # The only synced caller. It takes no repo-specific inputs, so one file
  # serves the whole org and the rules stay comparable across it
  # (norms/ci.md, "The repo checks"). The zizmor policy travels with it:
  # the caller names @v1, and zizmor rejects a tag without the policy.
  - src: ci/repo-checks.yml
    targets:
      - repo: portolan-sdi/portolan-spec
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/portolan-cli
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/rashid
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/portolan-registry
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/portolan-browser
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/portolan-skills
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/portolan-sdi.org
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/stac-partition-extension
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/stac-iceberg-extension
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/stac-osi-extension
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/portolan-nl-demo
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/portolan-bootstrapper
        dest: .github/workflows/repo-checks.yml

  - src: templates/repo/zizmor.yml
    targets:
      - repo: portolan-sdi/portolan-spec
        dest: zizmor.yml
      - repo: portolan-sdi/portolan-cli
        dest: zizmor.yml
      - repo: portolan-sdi/rashid
        dest: zizmor.yml
      - repo: portolan-sdi/portolan-registry
        dest: zizmor.yml
      - repo: portolan-sdi/portolan-browser
        dest: zizmor.yml
      - repo: portolan-sdi/portolan-skills
        dest: zizmor.yml
      - repo: portolan-sdi/portolan-sdi.org
        dest: zizmor.yml
      - repo: portolan-sdi/stac-partition-extension
        dest: zizmor.yml
      - repo: portolan-sdi/stac-iceberg-extension
        dest: zizmor.yml
      - repo: portolan-sdi/stac-osi-extension
        dest: zizmor.yml
      - repo: portolan-sdi/portolan-nl-demo
        dest: zizmor.yml
      - repo: portolan-sdi/portolan-bootstrapper
        dest: zizmor.yml

  # --- CI callers roll out per family as each repo migrates
  # (norms/ci.md, "Adding a repo to a family"). Uncomment per repo when
  # its inline workflows are ready to be replaced. Python repos take the
  # caller plus the three quality-floor files together.
  #
  # The family dependabot.yml travels with the caller: the caller pins a
  # major tag, and Dependabot is what turns an ops v2 release into a PR
  # downstream. A repo that already has its own dependabot.yml gets it
  # replaced, so reconcile the ecosystems before uncommenting.
  #
  # zizmor.yml already reaches every active repo above, shipped with the
  # repo checks, so a family caller needs no separate entry for it.
