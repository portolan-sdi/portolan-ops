# Fan-out map: which ops files go where.
#
# Each entry: src (path in this repo) -> targets [{repo, dest}], plus an
# optional mode on the entry itself. mode applies to every target of
# that entry; to send one file two ways, write two entries.
# mode "copy" (default) replaces the dest file wholesale.
# mode "block" replaces only the delimited region between
#   "<!-- ops-sync:begin ... -->" and "<!-- ops-sync:end -->" in the dest
#   file, creating the file from the block alone when it doesn't exist.
#   Content outside the markers is never touched.
#
# scripts/sync.py consumes this file; scripts/check_manifest.py validates it.
# Adding a repo to the fan-out is one edit here.
#
# auto_merge lists repos whose sync PR arms GitHub auto-merge, so their
# own required checks decide when it lands. A repo left off the list
# waits for a human. sync skips auto-merge on any run whose PR touches
# .github/workflows/, and on any branch with no required checks. See
# norms/ci.md, "Auto-merging the sync pull request".
auto_merge:
  - portolan-sdi/.github
  - portolan-sdi/portolan-spec
  - portolan-sdi/portolan-cli
  - portolan-sdi/rashid
  - portolan-sdi/portolan-registry
  - portolan-sdi/portolan-browser
  - portolan-sdi/portolan-skills
  - portolan-sdi/portolan-sdi.org
  - portolan-sdi/stac-partition-extension
  - portolan-sdi/stac-iceberg-extension
  - portolan-sdi/stac-osi-extension
  - portolan-sdi/portolan-nl-demo
  - portolan-sdi/portolan-bootstrapper

# extra_branches names branches the weekly drift report reads besides
# each repo's default branch. Sync writes the default branch alone, so a
# long-lived release branch keeps whatever synced files it forked with.
# portolan-cli/release/v1.0.0b0 carries .claude/settings.json without
# .claude/hooks/writing_check.py, which fails its own layout check on
# every pull request into it (portolan-sdi/portolan-cli#773). Listing the
# branch reports that drift. It delivers nothing. The repo cherry-picks
# the fix itself.
extra_branches:
  portolan-sdi/portolan-cli:
    - release/v1.0.0b0

sync:
  # --- Org profile + community health files -> the .github repo.
  # GitHub applies these defaults to every org repo that lacks its own copy.
  - src: copy/org-profile/README.md
    targets:
      - repo: portolan-sdi/.github
        dest: profile/README.md

  - src: policies/CODE_OF_CONDUCT.md
    targets:
      - repo: portolan-sdi/.github
        dest: CODE_OF_CONDUCT.md

  - src: policies/CONTRIBUTING.md
    targets:
      - repo: portolan-sdi/.github
        dest: CONTRIBUTING.md

  - src: policies/SECURITY.md
    targets:
      - repo: portolan-sdi/.github
        dest: SECURITY.md

  - src: policies/AI_POLICY.md
    targets:
      - repo: portolan-sdi/.github
        dest: AI_POLICY.md

  # The org default, for every repo that has no template of its own.
  - src: templates/PULL_REQUEST_TEMPLATE.md
    targets:
      - repo: portolan-sdi/.github
        dest: PULL_REQUEST_TEMPLATE.md

  # A repo carrying its own template shadows the org default: GitHub never
  # falls back. These three did, and drifted until their bodies could not
  # pass the pull-request check. Block mode syncs the canonical sections
  # and leaves each repo's own checklist below the markers alone. Two
  # entries because mode is per-entry, and the .github copy has no markers
  # to splice into.
  - src: templates/PULL_REQUEST_TEMPLATE.md
    mode: block
    targets:
      - repo: portolan-sdi/rashid
        dest: .github/pull_request_template.md
      - repo: portolan-sdi/portolan-cli
        dest: .github/pull_request_template.md
      - repo: portolan-sdi/portolan-browser
        dest: .github/pull_request_template.md

  # portolan-cli, rashid, and portolan-registry carry their own forms, which
  # shadow the org defaults the same way the PR template did and had drifted
  # from the canonical fields. The registry joined them for its
  # catalog-feedback form: one repo-level form hides all three org defaults,
  # so a repo that adds one has to carry the rest. Forms are YAML, so there
  # are no markers to splice: the canonical set syncs wholesale, and extra
  # forms under other filenames stay the repo's own.
  - src: templates/ISSUE_TEMPLATE/bug_report.yml
    targets:
      - repo: portolan-sdi/.github
        dest: .github/ISSUE_TEMPLATE/bug_report.yml
      - repo: portolan-sdi/portolan-cli
        dest: .github/ISSUE_TEMPLATE/bug_report.yml
      - repo: portolan-sdi/rashid
        dest: .github/ISSUE_TEMPLATE/bug_report.yml
      - repo: portolan-sdi/portolan-registry
        dest: .github/ISSUE_TEMPLATE/bug_report.yml
      - repo: portolan-sdi/portolan-data
        dest: .github/ISSUE_TEMPLATE/bug_report.yml

  - src: templates/ISSUE_TEMPLATE/feature_request.yml
    targets:
      - repo: portolan-sdi/.github
        dest: .github/ISSUE_TEMPLATE/feature_request.yml
      - repo: portolan-sdi/portolan-cli
        dest: .github/ISSUE_TEMPLATE/feature_request.yml
      - repo: portolan-sdi/rashid
        dest: .github/ISSUE_TEMPLATE/feature_request.yml
      - repo: portolan-sdi/portolan-registry
        dest: .github/ISSUE_TEMPLATE/feature_request.yml
      - repo: portolan-sdi/portolan-data
        dest: .github/ISSUE_TEMPLATE/feature_request.yml

  - src: templates/ISSUE_TEMPLATE/task.yml
    targets:
      - repo: portolan-sdi/.github
        dest: .github/ISSUE_TEMPLATE/task.yml
      - repo: portolan-sdi/portolan-cli
        dest: .github/ISSUE_TEMPLATE/task.yml
      - repo: portolan-sdi/rashid
        dest: .github/ISSUE_TEMPLATE/task.yml
      - repo: portolan-sdi/portolan-registry
        dest: .github/ISSUE_TEMPLATE/task.yml
      - repo: portolan-sdi/portolan-data
        dest: .github/ISSUE_TEMPLATE/task.yml

  # portolan-cli is deliberately absent. It already carries a docs form that
  # applies the label, and its dropdown names CLI Reference and Python API,
  # which the generic form cannot ask for. Syncing would delete that.
  - src: templates/ISSUE_TEMPLATE/docs_issue.yml
    targets:
      - repo: portolan-sdi/.github
        dest: .github/ISSUE_TEMPLATE/docs_issue.yml
      - repo: portolan-sdi/rashid
        dest: .github/ISSUE_TEMPLATE/docs_issue.yml
      - repo: portolan-sdi/portolan-registry
        dest: .github/ISSUE_TEMPLATE/docs_issue.yml
      - repo: portolan-sdi/portolan-data
        dest: .github/ISSUE_TEMPLATE/docs_issue.yml

  - src: templates/ISSUE_TEMPLATE/config.yml
    targets:
      - repo: portolan-sdi/.github
        dest: .github/ISSUE_TEMPLATE/config.yml
      - repo: portolan-sdi/portolan-cli
        dest: .github/ISSUE_TEMPLATE/config.yml
      - repo: portolan-sdi/rashid
        dest: .github/ISSUE_TEMPLATE/config.yml
      - repo: portolan-sdi/portolan-registry
        dest: .github/ISSUE_TEMPLATE/config.yml
      - repo: portolan-sdi/portolan-data
        dest: .github/ISSUE_TEMPLATE/config.yml

  # --- LICENSE -> every active repo that lacks it.
  # GitHub does not inherit licenses from .github.
  # portolan-browser and portolan-nl-demo are excluded pending the ISC
  # fork-license decision (norms/repos.md, "License").
  - src: LICENSE
    targets:
      - repo: portolan-sdi/portolan-skills
        dest: LICENSE
      - repo: portolan-sdi/portolan-data
        dest: LICENSE

  # --- Agent norms -> active repos.
  # portolan-catalog-template is one of them. It is a template repo, so a
  # catalog generated from it starts with the org norms, the writing hook,
  # and the repo checks already in place.
  # AGENTS.md carries the org norms as text, not as links, because agents
  # load what a file says and do not follow URLs to find out. The block is
  # generated from ops' own AGENTS.md by scripts/build_agents_block.py.
  # Only the delimited block is managed; repo-specific content below it
  # stays untouched.
  - src: templates/repo/AGENTS.md
    mode: block
    targets:
      - repo: portolan-sdi/.github
        dest: AGENTS.md
      - repo: portolan-sdi/portolan-spec
        dest: AGENTS.md
      - repo: portolan-sdi/portolan-cli
        dest: AGENTS.md
      - repo: portolan-sdi/rashid
        dest: AGENTS.md
      - repo: portolan-sdi/portolan-registry
        dest: AGENTS.md
      - repo: portolan-sdi/portolan-browser
        dest: AGENTS.md
      - repo: portolan-sdi/portolan-skills
        dest: AGENTS.md
      - repo: portolan-sdi/portolan-sdi.org
        dest: AGENTS.md
      - repo: portolan-sdi/stac-partition-extension
        dest: AGENTS.md
      - repo: portolan-sdi/stac-iceberg-extension
        dest: AGENTS.md
      - repo: portolan-sdi/stac-osi-extension
        dest: AGENTS.md
      - repo: portolan-sdi/portolan-nl-demo
        dest: AGENTS.md
      - repo: portolan-sdi/portolan-bootstrapper
        dest: AGENTS.md
      - repo: portolan-sdi/portolan-data
        dest: AGENTS.md
      - repo: portolan-sdi/portolan-catalog-template
        dest: AGENTS.md

  # --- CLAUDE.md bridge -> the same repos.
  # Claude Code reads CLAUDE.md and never AGENTS.md, so without this
  # file it sees no org norms at all. The block holds one import line.
  # block mode means a repo that already has a CLAUDE.md keeps its
  # content: sync prepends the block rather than replacing the file.
  - src: templates/repo/CLAUDE.md
    mode: block
    targets:
      - repo: portolan-sdi/.github
        dest: CLAUDE.md
      - repo: portolan-sdi/portolan-spec
        dest: CLAUDE.md
      - repo: portolan-sdi/portolan-cli
        dest: CLAUDE.md
      - repo: portolan-sdi/rashid
        dest: CLAUDE.md
      - repo: portolan-sdi/portolan-registry
        dest: CLAUDE.md
      - repo: portolan-sdi/portolan-browser
        dest: CLAUDE.md
      - repo: portolan-sdi/portolan-skills
        dest: CLAUDE.md
      - repo: portolan-sdi/portolan-sdi.org
        dest: CLAUDE.md
      - repo: portolan-sdi/stac-partition-extension
        dest: CLAUDE.md
      - repo: portolan-sdi/stac-iceberg-extension
        dest: CLAUDE.md
      - repo: portolan-sdi/stac-osi-extension
        dest: CLAUDE.md
      - repo: portolan-sdi/portolan-nl-demo
        dest: CLAUDE.md
      - repo: portolan-sdi/portolan-bootstrapper
        dest: CLAUDE.md
      - repo: portolan-sdi/portolan-data
        dest: CLAUDE.md
      - repo: portolan-sdi/portolan-catalog-template
        dest: CLAUDE.md
  # --- Writing hook -> every active repo.
  # The checker runs before `gh issue create` and `gh pr create` and
  # reports what to fix. It holds the rules it enforces, so the text an
  # agent reads cannot drift from the checks that run.
  #
  # settings.json uses merge-json, not copy: a repo may wire hooks of
  # its own, and a wholesale copy would delete them. The merge rewrites
  # only the entries whose command names writing_check.py.
  # The .github repo is left out. It carries no working tree.
  - src: .claude/hooks/writing_check.py
    targets:
      - repo: portolan-sdi/portolan-spec
        dest: .claude/hooks/writing_check.py
      - repo: portolan-sdi/portolan-cli
        dest: .claude/hooks/writing_check.py
      - repo: portolan-sdi/rashid
        dest: .claude/hooks/writing_check.py
      - repo: portolan-sdi/portolan-registry
        dest: .claude/hooks/writing_check.py
      - repo: portolan-sdi/portolan-browser
        dest: .claude/hooks/writing_check.py
      - repo: portolan-sdi/portolan-skills
        dest: .claude/hooks/writing_check.py
      - repo: portolan-sdi/portolan-sdi.org
        dest: .claude/hooks/writing_check.py
      - repo: portolan-sdi/stac-partition-extension
        dest: .claude/hooks/writing_check.py
      - repo: portolan-sdi/stac-iceberg-extension
        dest: .claude/hooks/writing_check.py
      - repo: portolan-sdi/stac-osi-extension
        dest: .claude/hooks/writing_check.py
      - repo: portolan-sdi/portolan-nl-demo
        dest: .claude/hooks/writing_check.py
      - repo: portolan-sdi/portolan-bootstrapper
        dest: .claude/hooks/writing_check.py
      - repo: portolan-sdi/portolan-data
        dest: .claude/hooks/writing_check.py
      - repo: portolan-sdi/portolan-catalog-template
        dest: .claude/hooks/writing_check.py
  - src: .claude/output-styles/simplified-technical-english.md
    targets:
      - repo: portolan-sdi/portolan-spec
        dest: .claude/output-styles/simplified-technical-english.md
      - repo: portolan-sdi/portolan-cli
        dest: .claude/output-styles/simplified-technical-english.md
      - repo: portolan-sdi/rashid
        dest: .claude/output-styles/simplified-technical-english.md
      - repo: portolan-sdi/portolan-registry
        dest: .claude/output-styles/simplified-technical-english.md
      - repo: portolan-sdi/portolan-browser
        dest: .claude/output-styles/simplified-technical-english.md
      - repo: portolan-sdi/portolan-skills
        dest: .claude/output-styles/simplified-technical-english.md
      - repo: portolan-sdi/portolan-sdi.org
        dest: .claude/output-styles/simplified-technical-english.md
      - repo: portolan-sdi/stac-partition-extension
        dest: .claude/output-styles/simplified-technical-english.md
      - repo: portolan-sdi/stac-iceberg-extension
        dest: .claude/output-styles/simplified-technical-english.md
      - repo: portolan-sdi/stac-osi-extension
        dest: .claude/output-styles/simplified-technical-english.md
      - repo: portolan-sdi/portolan-nl-demo
        dest: .claude/output-styles/simplified-technical-english.md
      - repo: portolan-sdi/portolan-bootstrapper
        dest: .claude/output-styles/simplified-technical-english.md
      - repo: portolan-sdi/portolan-data
        dest: .claude/output-styles/simplified-technical-english.md
      - repo: portolan-sdi/portolan-catalog-template
        dest: .claude/output-styles/simplified-technical-english.md

  - src: .claude/settings.json
    mode: merge-json
    targets:
      - repo: portolan-sdi/portolan-spec
        dest: .claude/settings.json
      - repo: portolan-sdi/portolan-cli
        dest: .claude/settings.json
      - repo: portolan-sdi/rashid
        dest: .claude/settings.json
      - repo: portolan-sdi/portolan-registry
        dest: .claude/settings.json
      - repo: portolan-sdi/portolan-browser
        dest: .claude/settings.json
      - repo: portolan-sdi/portolan-skills
        dest: .claude/settings.json
      - repo: portolan-sdi/portolan-sdi.org
        dest: .claude/settings.json
      - repo: portolan-sdi/stac-partition-extension
        dest: .claude/settings.json
      - repo: portolan-sdi/stac-iceberg-extension
        dest: .claude/settings.json
      - repo: portolan-sdi/stac-osi-extension
        dest: .claude/settings.json
      - repo: portolan-sdi/portolan-nl-demo
        dest: .claude/settings.json
      - repo: portolan-sdi/portolan-bootstrapper
        dest: .claude/settings.json
      - repo: portolan-sdi/portolan-data
        dest: .claude/settings.json
      - repo: portolan-sdi/portolan-catalog-template
        dest: .claude/settings.json

  # --- Repo checks -> every active repo.
  # The only synced caller. It takes no repo-specific inputs, so one file
  # serves the whole org and the rules stay comparable across it
  # (norms/ci.md, "The repo checks"). The zizmor policy travels with it:
  # the caller names @v1, and zizmor rejects a tag without the policy.
  - src: ci/repo-checks.yml
    targets:
      - repo: portolan-sdi/.github
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/portolan-spec
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/portolan-cli
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/rashid
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/portolan-registry
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/portolan-browser
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/portolan-skills
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/portolan-sdi.org
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/stac-partition-extension
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/stac-iceberg-extension
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/stac-osi-extension
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/portolan-nl-demo
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/portolan-bootstrapper
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/portolan-data
        dest: .github/workflows/repo-checks.yml
      - repo: portolan-sdi/portolan-catalog-template
        dest: .github/workflows/repo-checks.yml


  # --- Prose linting -> every repo with prose. The rules live in styles/
  # and .vale.ini here, and the reusable workflow fetches them, so a repo
  # takes only this caller. It reports without failing. Move a repo to
  # `fail-on: error` once its prose is clean. portolan-ops keeps its own
  # caller in the working tree, pointing at this commit.
  #
  # .github is left out. It carries no working tree.
  - src: ci/vale.yml
    targets:
      - repo: portolan-sdi/portolan-spec
        dest: .github/workflows/vale.yml
      - repo: portolan-sdi/portolan-cli
        dest: .github/workflows/vale.yml
      - repo: portolan-sdi/rashid
        dest: .github/workflows/vale.yml
      - repo: portolan-sdi/portolan-registry
        dest: .github/workflows/vale.yml
      - repo: portolan-sdi/portolan-browser
        dest: .github/workflows/vale.yml
      - repo: portolan-sdi/portolan-skills
        dest: .github/workflows/vale.yml
      - repo: portolan-sdi/portolan-sdi.org
        dest: .github/workflows/vale.yml
      - repo: portolan-sdi/stac-partition-extension
        dest: .github/workflows/vale.yml
      - repo: portolan-sdi/stac-iceberg-extension
        dest: .github/workflows/vale.yml
      - repo: portolan-sdi/stac-osi-extension
        dest: .github/workflows/vale.yml
      - repo: portolan-sdi/portolan-nl-demo
        dest: .github/workflows/vale.yml
      - repo: portolan-sdi/portolan-bootstrapper
        dest: .github/workflows/vale.yml
      - repo: portolan-sdi/portolan-data
        dest: .github/workflows/vale.yml
      - repo: portolan-sdi/portolan-catalog-template
        dest: .github/workflows/vale.yml
  # --- Dependabot auto-merge -> every repo with a Dependabot config.
  # The target branch's required checks decide whether the PR can merge.
  # The workflow treats major, minor, patch, and security updates alike.
  # --- Issue governance -> every repo with issues enabled.
  # The rules and the canonical label set live here, in scripts/ and
  # issue-governance/. portolan-ops keeps its own caller in the working tree,
  # because sync never writes to the repo it runs from, and that caller
  # points at this commit so a rule change is tested by its own pull request.
  - src: ci/issue-governance.yml
    targets:
      - repo: portolan-sdi/.github
        dest: .github/workflows/issue-governance.yml
      - repo: portolan-sdi/portolan-spec
        dest: .github/workflows/issue-governance.yml
      - repo: portolan-sdi/portolan-cli
        dest: .github/workflows/issue-governance.yml
      - repo: portolan-sdi/rashid
        dest: .github/workflows/issue-governance.yml
      - repo: portolan-sdi/portolan-registry
        dest: .github/workflows/issue-governance.yml
      - repo: portolan-sdi/portolan-browser
        dest: .github/workflows/issue-governance.yml
      - repo: portolan-sdi/portolan-skills
        dest: .github/workflows/issue-governance.yml
      - repo: portolan-sdi/portolan-sdi.org
        dest: .github/workflows/issue-governance.yml
      - repo: portolan-sdi/stac-partition-extension
        dest: .github/workflows/issue-governance.yml
      - repo: portolan-sdi/stac-iceberg-extension
        dest: .github/workflows/issue-governance.yml
      - repo: portolan-sdi/stac-osi-extension
        dest: .github/workflows/issue-governance.yml
      - repo: portolan-sdi/portolan-bootstrapper
        dest: .github/workflows/issue-governance.yml
      - repo: portolan-sdi/portolan-data
        dest: .github/workflows/issue-governance.yml
      - repo: portolan-sdi/portolan-catalog-template
        dest: .github/workflows/issue-governance.yml

  # --- Pull request board -> every active repo.
  # The rule lives here, in reusable-pr-board.yml. It puts a pull request a
  # person opens on the org project board and leaves bot pull requests off
  # it. portolan-ops keeps its own caller in the working tree, because sync
  # never writes to the repo it runs from.
  #
  # portolan-nl-demo takes this one although it has issues disabled. The
  # board rule reads pull requests, not issues.
  - src: ci/pr-board.yml
    targets:
      - repo: portolan-sdi/.github
        dest: .github/workflows/pr-board.yml
      - repo: portolan-sdi/portolan-spec
        dest: .github/workflows/pr-board.yml
      - repo: portolan-sdi/portolan-cli
        dest: .github/workflows/pr-board.yml
      - repo: portolan-sdi/rashid
        dest: .github/workflows/pr-board.yml
      - repo: portolan-sdi/portolan-registry
        dest: .github/workflows/pr-board.yml
      - repo: portolan-sdi/portolan-browser
        dest: .github/workflows/pr-board.yml
      - repo: portolan-sdi/portolan-skills
        dest: .github/workflows/pr-board.yml
      - repo: portolan-sdi/portolan-sdi.org
        dest: .github/workflows/pr-board.yml
      - repo: portolan-sdi/stac-partition-extension
        dest: .github/workflows/pr-board.yml
      - repo: portolan-sdi/stac-iceberg-extension
        dest: .github/workflows/pr-board.yml
      - repo: portolan-sdi/stac-osi-extension
        dest: .github/workflows/pr-board.yml
      - repo: portolan-sdi/portolan-nl-demo
        dest: .github/workflows/pr-board.yml
      - repo: portolan-sdi/portolan-bootstrapper
        dest: .github/workflows/pr-board.yml
      - repo: portolan-sdi/portolan-data
        dest: .github/workflows/pr-board.yml
      - repo: portolan-sdi/portolan-catalog-template
        dest: .github/workflows/pr-board.yml
  - src: ci/dependabot-automerge.yml
    targets:
      - repo: portolan-sdi/portolan-spec
        dest: .github/workflows/dependabot-automerge.yml
      - repo: portolan-sdi/portolan-cli
        dest: .github/workflows/dependabot-automerge.yml
      - repo: portolan-sdi/rashid
        dest: .github/workflows/dependabot-automerge.yml
      - repo: portolan-sdi/portolan-registry
        dest: .github/workflows/dependabot-automerge.yml

  # Codecov supplies reports and comments. diff-cover remains the local
  # coverage gate, so a missing Codecov callback cannot hold a merge.
  - src: templates/repo/codecov.yml
    targets:
      - repo: portolan-sdi/portolan-cli
        dest: codecov.yml
      - repo: portolan-sdi/rashid
        dest: codecov.yml

  - src: templates/repo/zizmor.yml
    targets:
      - repo: portolan-sdi/portolan-spec
        dest: zizmor.yml
      - repo: portolan-sdi/portolan-cli
