# Minimal package that exercises the reusable Python CI on ops PRs.
# It carries the full family dev-dependency contract so every job in
# reusable-python-ci.yml runs for real (see ci-selftest.yml).
[project]
name = "portolan-ci-fixture"
version = "0.1.0"
description = "Fixture package for testing reusable-python-ci.yml"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "diff-cover>=9.0",
    "mypy>=1.14",
    "vulture>=2.14",
    "xenon>=0.9.3",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "mutmut>=3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixture_pkg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# mutmut runs the suite from a copied mutants/ sandbox. Without this
# the editable install wins the import, the tests exercise the
# original source, and every mutant looks uncovered.
pythonpath = ["src"]

[tool.mypy]
strict = true
files = ["src"]

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.mutmut]
source_paths = ["src/fixture_pkg/"]
pytest_add_cli_args_test_selection = ["tests/"]
# pyproject injects no --cov here, but mutmut runs the suite from a copied
# sandbox, and --no-cov keeps coverage instrumentation from interfering if
# that changes. --tb=short shows where a stats-phase failure happened.
pytest_add_cli_args = ["--no-cov", "--tb=short"]
also_copy = [".mutation-baseline"]
