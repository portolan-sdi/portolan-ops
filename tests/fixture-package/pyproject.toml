# Minimal package that exercises the reusable Python CI on ops PRs.
# It carries the full family dev-dependency contract so every job in
# reusable-python-ci.yml runs for real (see ci-selftest.yml).
[project]
name = "portolan-ci-fixture"
version = "0.1.0"
description = "Fixture package for testing reusable-python-ci.yml"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "diff-cover>=9.0",
    "mypy>=1.14",
    "vulture>=2.14",
    "xenon>=0.9.3",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixture_pkg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
source = ["src"]
