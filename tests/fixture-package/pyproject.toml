# Minimal package that exercises the reusable Python CI on ops PRs.
# It carries the full family dev-dependency contract so every job in
# reusable-python-ci.yml runs for real (see ci-selftest.yml).
[project]
name = "portolan-ci-fixture"
version = "0.1.0"
description = "Fixture package for testing reusable-python-ci.yml"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "diff-cover>=9.0",
    "mypy>=1.14",
    "vulture>=2.14",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "deptry>=0.23",
    "import-linter>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixture_pkg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# The family's complexity gate. Ruff reads it in the commit-stage hook.
[tool.ruff.lint]
extend-select = ["C901", "PLR09"]

[tool.mypy]
strict = true
files = ["src"]

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.bandit]
exclude_dirs = ["tests"]

[tool.deptry]
known_first_party = ["fixture_pkg"]
exclude = [".venv", "tests"]

# One contract, so the guarded import-linter hook takes its positive path
# and the self-test proves lint-imports actually runs.
[tool.importlinter]
root_package = "fixture_pkg"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "the package core must not import a CLI framework"
type = "forbidden"
source_modules = ["fixture_pkg"]
forbidden_modules = ["click"]

[tool.coverage.run]
source = ["src"]
