# Ops' own hooks — an instance of the synced template
# (templates/repo/.pre-commit-config.yaml) minus the Python-package
# pre-push gates, since this repo is scripts and prose, not a package.
# Run with prek: `uvx prek run --all-files`.

# The fixture package is its own prek workspace with its own config, and
# prek runs it separately. Linting it from here too made ruff flip one
# import back and forth forever: this config has no ruff settings, so
# fixture_pkg reads as third-party, while the fixture's own config knows
# it is first-party and wants the blank line between the groups.
exclude: ^tests/fixture-package/

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Upstream license text stays verbatim (norms/docs.md). The OFL
      # carries a trailing space these hooks would strip.
      - id: trailing-whitespace
        exclude: ^brand/fonts/OFL-.*\.txt$
      - id: end-of-file-fixer
        exclude: ^brand/fonts/OFL-.*\.txt$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        # The template helper supports Python 3.10. datetime.UTC is 3.11+.
        args:
          - --fix
          - --config
          - 'per-file-target-version = {"templates/repo/scripts/pip_audit_ignores.py" = "py310"}'
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
        # Credited upstream text stays verbatim (norms/docs.md).
        # A lockfile carries upstream package names, not prose.
        exclude: |
          (?x)^(
            policies/AI_POLICY\.md
            |brand/slidev-addon-portolan/package-lock\.json
          )$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args: [--no-online-audits]

  # The org Renovate preset and the self-hosted global config. The validator
  # reads a named file as global config, so the preset needs --no-global.
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.181.1
    hooks:
      - id: renovate-config-validator
        name: renovate preset
        args: [--strict, --no-global]
        files: ^renovate/default\.json5$
      - id: renovate-config-validator
        name: renovate global config
        args: [--strict]
        files: ^renovate/global\.json5$

  # Prose rules. The styles live in styles/ and the reasons in norms/prose.md.
  # `sync` fetches the pinned third-party packages; it takes no filenames.
  - repo: https://github.com/vale-cli/vale
    rev: 3.25.1
    hooks:
      - id: vale
        name: vale sync
        args: [sync]
        pass_filenames: false
      - id: vale
        args: [--output=line, --minAlertLevel=error]

  # Relative links and anchors. Other repos install the same hook from
  # .pre-commit-hooks.yaml at a release tag. This copy runs the script in
  # the working tree, so a change to it is tested before it ships.
  - repo: local
    hooks:
      - id: lychee
        name: lychee (relative links and anchors)
        entry: scripts/lychee.sh
        language: script
        args: [--offline, --mode, plain]
        types_or: [markdown, html]
        require_serial: true

  # General English checks that do not overlap the Portolan Vale styles.
  - repo: https://github.com/amperser/proselint
    rev: v0.16.0
    hooks:
      - id: proselint
        args: [check, --config, proselint.json]
        types: [markdown]
        exclude: |
          (?x)^(
            \.claude/
            |policies/(AI_POLICY|CODE_OF_CONDUCT)\.md$
            |brand/slidev-addon-portolan/example/slides\.md$
          )
