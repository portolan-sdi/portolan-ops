# Ops' own hooks — an instance of the synced template
# (templates/repo/.pre-commit-config.yaml) minus the Python-package
# pre-push gates, since this repo is scripts and prose, not a package.
# Run with prek: `uvx prek run --all-files`.

# The fixture package is its own prek workspace with its own config, and
# prek runs it separately. Linting it from here too made ruff flip one
# import back and forth forever: this config has no ruff settings, so
# fixture_pkg reads as third-party, while the fixture's own config knows
# it is first-party and wants the blank line between the groups.
exclude: ^tests/fixture-package/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
        # Credited upstream text stays verbatim (norms/docs.md).
        exclude: ^policies/AI_POLICY\.md$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor
        args: [--no-online-audits]
