# Thin caller — synced from portolan-sdi/portolan-ops (ci/web-app/).
# CI logic lives in ops' reusable-web-ci.yml; change it there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # No branch filter. A pull request aimed anywhere else still runs
    # these checks; without that, a stacked pull request shows green
    # having run none of them.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Moving major tag; v2 arrives as a Dependabot PR.
    uses: portolan-sdi/portolan-ops/.github/workflows/reusable-web-ci.yml@v1
    # with:
    #   package-manager: npm
    #   test-command: ""    # for repos without unit tests yet
