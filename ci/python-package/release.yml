# Release to PyPI via Trusted Publishing — synced from
# portolan-sdi/portolan-ops (ci/python-package/).
#
# One-time setup per repo, before the first release:
#   1. On pypi.org, add a "trusted publisher" for the project:
#      owner portolan-sdi, this repo, workflow release.yml,
#      environment pypi.
#   2. In the repo settings, create a deployment environment named
#      "pypi" (optionally with required reviewers as a release gate).
# No API tokens anywhere: the publish job authenticates with an OIDC
# token minted for the run.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: |
          uv python install 3.13
          uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      # Trusted Publishing mints the PyPI credential from this token.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
