# Synced skeleton for Python repos; extend per repo.
# Run with prek (https://github.com/j178/prek), the Rust pre-commit
# runner CI uses: `uvx prek install --hook-type pre-commit
# --hook-type pre-push`, then `uvx prek run --all-files`.
#
# The pre-push hooks assume these dev dependencies in pyproject.toml:
# mypy, vulture, xenon. CI runs both stages, so an unhooked clone
# cannot merge past them.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  # Lint GitHub Actions workflow syntax and semantics.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Audit workflows for security issues (unpinned actions, missing
  # permissions, template injection). Offline mode keeps it
  # deterministic and token-free.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor
        args: [--no-online-audits]

  # Pre-push stage: the slower quality gates. CI runs these too
  # (reusable-python-ci.yml, "pre-push stage" step).
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        description: Static type check (same gate as CI)
        # Narrow the target to the package dir per repo.
        entry: uv run mypy .
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: vulture
        name: vulture
        description: Find unused code (paths/confidence from [tool.vulture])
        entry: uv run vulture
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: xenon
        name: xenon
        description: Complexity gate (same thresholds as CI)
        # Adjust paths per repo (src layout vs flat package dir).
        entry: uv run xenon --max-absolute=E --max-modules=D --max-average=C src tests
        language: system
        pass_filenames: false
        stages: [pre-push]
