name: Bug report
description: Something is wrong or crashes
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command or steps and the output you got.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >-
        The smallest input (catalog snippet, file, command sequence) that
        triggers the problem. Strip anything private.
  - type: input
    id: version
    attributes:
      label: Version
      description: Tool version, or commit SHA for unreleased builds.
    validations:
      required: true
