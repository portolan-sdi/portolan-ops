name: Sync downstream

on:
  push:
    branches: [main]
    paths:
      - LICENSE
      - copy/org-profile/**
      - policies/**
      - templates/**
      - ci/**
      - sync/manifest.yml
      - scripts/sync.py
      - .claude/hooks/**
      - .claude/output-styles/**
      - .claude/settings.json
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only; push nothing and open no PRs.
        type: boolean
        default: true
      repo:
        description: Limit to one owner/name target (optional).
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ops-sync
  cancel-in-progress: false

env:
  PYYAML_VERSION: ${{ vars.PYYAML_VERSION || '6.0.3' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Validate manifest
        run: >-
          uv run --no-project --with "pyyaml==$PYYAML_VERSION"
          python scripts/check_manifest.py

      # Read the token's repo scope off the manifest so the fan-out map
      # stays the one place repos are listed.
      - name: Collect manifest repos
        id: repos
        run: |
          uv run --no-project --with "pyyaml==$PYYAML_VERSION" python - \
            >> "$GITHUB_OUTPUT" <<'PY'
          import yaml

          manifest = yaml.safe_load(open("sync/manifest.yml"))
          names = sorted(
              {
                  target["repo"].split("/", 1)[1]
                  for entry in manifest["sync"]
                  for target in entry["targets"]
              }
          )
          print("list=" + ",".join(names))
          PY

      # Installation token: expires in an hour, reaches only the
      # manifest repos, and carries only the permissions sync needs.
      # These inputs scope the token down from what the app holds, so a
      # permission the app has but this list omits is a permission the
      # token lacks. workflows: write is here because the manifest writes
      # under .github/workflows/, and GitHub rejects a push touching that
      # directory without it, whatever contents: write allows.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.OPS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_SYNC_APP_KEY }}
          owner: portolan-sdi
          repositories: ${{ steps.repos.outputs.list }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          # Read-only. Classic branch protection answers only to this, and
          # scripts/sync.py reads it to find the checks that gate auto-merge.
          # Repos gated by rulesets answer from contents:read and need none.
          permission-administration: read

      - name: Configure git credentials for gh token
        # `gh repo clone` works from GH_TOKEN alone, but the plain
        # `git push` in sync.py needs a credential helper.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh auth setup-git

      - name: Run sync
        env:
          # App installation token with contents:write and
          # pull_requests:write on the manifest repos.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          ONLY_REPO: ${{ inputs.repo }}
        run: |
          ARGS=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
            if [ -n "$ONLY_REPO" ]; then
              ARGS="$ARGS --repo $ONLY_REPO"
            fi
          fi
          # Attribute commits to the app's bot account. Deriving the id
          # from the slug keeps this correct if the app is renamed.
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email \
            "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086
          uv run --no-project --with "pyyaml==$PYYAML_VERSION" \
            python scripts/sync.py $ARGS
