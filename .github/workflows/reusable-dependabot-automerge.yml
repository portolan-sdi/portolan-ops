# Every Dependabot update merges after the target branch's required checks pass.
# The caller grants write access. This workflow never checks out PR content.
name: Reusable Dependabot auto-merge

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependabot:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
