# This repo runs the body check it ships. Unlike downstream callers it
# points at the local workflow and takes the linter from this commit, so a
# change to the rules is exercised by the pull request that makes it.
name: Body check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  body:
    uses: ./.github/workflows/reusable-body-check.yml
    permissions:
      contents: read
      issues: write
    with:
      ops-ref: ${{ github.sha }}
