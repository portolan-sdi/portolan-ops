# Shared repo checks for every portolan-sdi repo.
#
#   pull-request  the body has the required sections and carries evidence
#   layout        AGENTS.md holds the norms and CLAUDE.md imports them
#
# These check structure, not writing. The writing itself is checked before a
# body is ever filed, by .claude/hooks/writing_check.py, which runs on
# `gh pr create` and reports specific problems.
#
# The rules live in one place, scripts/ here, so changing them is one pull
# request rather than one per repo. Callers check nothing out themselves.
# This workflow fetches what it runs.
name: Reusable repo checks

on:
  workflow_call:
    inputs:
      ops-ref:
        description: >-
          Ref of portolan-ops to take the checks from. Callers leave this
          alone; portolan-ops itself passes its own commit so a change to
          the rules is tested by the pull request that makes it.
        type: string
        default: v1
      is-source:
        description: >-
          True only for portolan-ops, whose AGENTS.md writes the synced block
          rather than receiving it and so carries no markers.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The calling repo, which is what gets checked.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      # Ops, which supplies the check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: portolan-sdi/portolan-ops
          ref: ${{ inputs.ops-ref }}
          path: ops
          persist-credentials: false
      - name: Check the agent files
        env:
          IS_SOURCE: ${{ inputs.is-source }}
        run: |
          if [ "$IS_SOURCE" = "true" ]; then
            python3 ops/scripts/check_repo_layout.py repo --is-source
          else
            python3 ops/scripts/check_repo_layout.py repo
          fi

  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: portolan-sdi/portolan-ops
          ref: ${{ inputs.ops-ref }}
          persist-credentials: false
      - name: Check the pull request body
        env:
          # Through the environment, never interpolated into the script:
          # a body is attacker-controlled text.
          BODY: ${{ github.event.pull_request.body }}
          # The author, not github.actor, which becomes whoever reran the
          # job. The job still runs and still reports "checks /
          # pull-request": an `if:` skip on a reusable-workflow caller
          # renames the check and leaves branch protection waiting forever.
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          printf '%s' "$BODY" | python3 scripts/lint_body.py \
            --kind pr \
            --author "$AUTHOR"
