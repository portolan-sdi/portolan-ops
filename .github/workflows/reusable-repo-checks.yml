# Shared repo checks for every portolan-sdi repo.
#
#   pull-request  the body is readable and carries evidence
#   issue         the same, reported by label since issues have no check
#   layout        AGENTS.md holds the norms and CLAUDE.md imports them
#
# The rules live in one place, scripts/ here, so changing the budget or the
# file layout is one pull request rather than one per repo. Callers check
# nothing out themselves; this workflow fetches what it runs.
name: Reusable repo checks

on:
  workflow_call:
    inputs:
      max-words:
        description: Prose words allowed outside fenced code blocks.
        type: number
        default: 200
      max-section-lines:
        description: Non-code lines allowed under a single heading.
        type: number
        default: 6
      ops-ref:
        description: >-
          Ref of portolan-ops to take the checks from. Callers leave this
          alone; portolan-ops itself passes its own commit so a change to
          the rules is tested by the pull request that makes it.
        type: string
        default: v1
      is-source:
        description: >-
          True only for portolan-ops, whose AGENTS.md writes the synced block
          rather than receiving it and so carries no markers.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  layout:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The calling repo, which is what gets checked.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      # Ops, which supplies the check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: portolan-sdi/portolan-ops
          ref: ${{ inputs.ops-ref }}
          path: ops
          persist-credentials: false
      - name: Check the agent files
        env:
          IS_SOURCE: ${{ inputs.is-source }}
        run: |
          if [ "$IS_SOURCE" = "true" ]; then
            python3 ops/scripts/check_repo_layout.py repo --is-source
          else
            python3 ops/scripts/check_repo_layout.py repo
          fi

  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: portolan-sdi/portolan-ops
          ref: ${{ inputs.ops-ref }}
          persist-credentials: false
      - name: Check the pull request body
        env:
          # Through the environment, never interpolated into the script:
          # a body is attacker-controlled text.
          BODY: ${{ github.event.pull_request.body }}
          # The author, not github.actor, which becomes whoever reran the
          # job. The job still runs and still reports "checks /
          # pull-request": an `if:` skip on a reusable-workflow caller
          # renames the check and leaves branch protection waiting forever.
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MAX_WORDS: ${{ inputs.max-words }}
          MAX_SECTION_LINES: ${{ inputs.max-section-lines }}
        run: |
          printf '%s' "$BODY" | python3 scripts/lint_body.py \
            --kind pr \
            --author "$AUTHOR" \
            --max-words "$MAX_WORDS" \
            --max-section-lines "$MAX_SECTION_LINES"

  issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: portolan-sdi/portolan-ops
          ref: ${{ inputs.ops-ref }}
          persist-credentials: false
      - name: Check the issue body
        id: check
        env:
          BODY: ${{ github.event.issue.body }}
          MAX_WORDS: ${{ inputs.max-words }}
          MAX_SECTION_LINES: ${{ inputs.max-section-lines }}
        run: |
          set +e
          printf '%s' "$BODY" | python3 scripts/lint_body.py \
            --kind issue \
            --max-words "$MAX_WORDS" \
            --max-section-lines "$MAX_SECTION_LINES" \
            2> findings.txt
          echo "failed=$?" >> "$GITHUB_OUTPUT"
          cat findings.txt
      - name: Label and explain
        if: steps.check.outputs.failed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          MARKER: "<!-- ops-body-check -->"
        run: |
          gh label create needs-rewrite \
            --description "Body is over budget or missing evidence" \
            --color d93f0b || true
          gh issue edit "$NUMBER" --add-label needs-rewrite
          existing=$(gh issue view "$NUMBER" --json comments \
            --jq "[.comments[] | select(.body | contains(\"$MARKER\"))] | length")
          if [ "$existing" = "0" ]; then
            { echo "$MARKER"; cat findings.txt; } > comment.md
            gh issue comment "$NUMBER" --body-file comment.md
          fi
      - name: Clear the label once it passes
        if: steps.check.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$NUMBER" --remove-label needs-rewrite || true
