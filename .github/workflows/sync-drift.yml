# Weekly adoption dashboard: compares every manifest repo's default
# branch against ground truth and writes a table to the run summary.
# Sync only pushes PRs; this shows whether they landed.
name: Sync drift report

on:
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Report drift
        env:
          GH_TOKEN: ${{ secrets.OPS_SYNC_TOKEN }}
        run: |
          uv python install 3.13
          {
            echo "## Fleet drift vs ground truth"
            echo ""
            uv run --no-project --with pyyaml==6.0.2 \
              python scripts/sync.py --drift-report
          } >> "$GITHUB_STEP_SUMMARY"
