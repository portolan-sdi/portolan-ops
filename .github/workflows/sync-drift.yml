# Weekly adoption dashboard: compares every manifest repo's default
# branch against ground truth. Sync only pushes PRs; this shows whether
# they landed. Drift, a clone error, or an active repo the manifest
# misses fails the run and keeps one tracking issue open in ops, so the
# gap lands where work is tracked instead of in a step summary.
name: Sync drift report

on:
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-drift
  cancel-in-progress: false

env:
  PYYAML_VERSION: ${{ vars.PYYAML_VERSION || '6.0.3' }}

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      # Same manifest-derived scope as sync.yml. This job only reads.
      - name: Collect manifest repos
        id: repos
        run: |
          uv run --no-project --with "pyyaml==$PYYAML_VERSION" python - \
            >> "$GITHUB_OUTPUT" <<'PY'
          import yaml

          manifest = yaml.safe_load(open("sync/manifest.yml"))
          names = sorted(
              {
                  target["repo"].split("/", 1)[1]
                  for entry in manifest["sync"]
                  for target in entry["targets"]
              }
          )
          print("list=" + ",".join(names))
          PY

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.OPS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_SYNC_APP_KEY }}
          owner: portolan-sdi
          repositories: ${{ steps.repos.outputs.list }}
          permission-contents: read
          permission-pull-requests: read

      - name: Report drift
        id: report
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          result=0
          uv run --no-project --with "pyyaml==$PYYAML_VERSION" \
            python scripts/sync.py --drift-report > report.md || result=$?
          echo "result=$result" >> "$GITHUB_OUTPUT"
          {
            echo "## Fleet drift vs ground truth"
            echo ""
            cat report.md
          } >> "$GITHUB_STEP_SUMMARY"

      # One tracking issue in ops, opened or bumped while anything is
      # off, closed once the fleet is clean. Uses the repo token: the
      # app token above is scoped to the downstream repos.
      - name: Update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.report.outputs.result }}
        run: |
          title="Sync drift: fleet is behind ground truth"
          number=$(gh issue list --state open \
            --search "in:title \"$title\"" \
            --json number --jq '.[0].number // empty')
          if [ "$RESULT" != "0" ]; then
            body=$(printf 'From the weekly drift run:\n\n%s\n' \
              "$(cat report.md)")
            if [ -z "$number" ]; then
              gh issue create --title "$title" --body "$body"
            else
              gh issue comment "$number" --body "$body"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "The fleet is in sync."
          fi

      - name: Fail when anything is off
        if: steps.report.outputs.result != '0'
        run: |
          cat report.md
          exit 1
