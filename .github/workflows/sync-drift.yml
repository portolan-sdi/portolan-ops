# Weekly adoption dashboard: compares every manifest repo's default
# branch against ground truth and writes a table to the run summary.
# Sync only pushes PRs; this shows whether they landed.
name: Sync drift report

on:
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-drift
  cancel-in-progress: false

env:
  PYYAML_VERSION: ${{ vars.PYYAML_VERSION || '6.0.2' }}

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      # Same manifest-derived scope as sync.yml. This job only reads.
      - name: Collect manifest repos
        id: repos
        run: |
          uv run --no-project --with "pyyaml==$PYYAML_VERSION" python - \
            >> "$GITHUB_OUTPUT" <<'PY'
          import yaml

          manifest = yaml.safe_load(open("sync/manifest.yml"))
          names = sorted(
              {
                  target["repo"].split("/", 1)[1]
                  for entry in manifest["sync"]
                  for target in entry["targets"]
              }
          )
          print("list=" + ",".join(names))
          PY

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.OPS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_SYNC_APP_KEY }}
          owner: portolan-sdi
          repositories: ${{ steps.repos.outputs.list }}
          permission-contents: read
          permission-pull-requests: read

      - name: Report drift
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          {
            echo "## Fleet drift vs ground truth"
            echo ""
            uv run --no-project --with "pyyaml==$PYYAML_VERSION" \
              python scripts/sync.py --drift-report
          } >> "$GITHUB_STEP_SUMMARY"
