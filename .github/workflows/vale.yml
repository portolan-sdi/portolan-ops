# This repo runs the rules it ships. Unlike downstream callers it points at
# the local workflow and takes the styles from this commit, so a change to
# a rule is exercised by the pull request that makes it.
name: Vale

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prose:
    uses: ./.github/workflows/reusable-vale.yml
    permissions:
      contents: read
    with:
      ops-ref: ${{ github.sha }}
      # portolan-ops holds itself to the rules it writes.
      fail-on: error
