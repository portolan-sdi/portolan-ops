name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PREK_VERSION: ${{ vars.PREK_VERSION || '0.4.12' }}
  PYYAML_VERSION: ${{ vars.PYYAML_VERSION || '6.0.3' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Run hooks (ruff, codespell, actionlint, zizmor, basics)
        run: >-
          uvx prek@"$PREK_VERSION" run --all-files
          --show-diff-on-failure

      - name: Validate sync manifest
        run: >-
          uv run --no-project --with "pyyaml==$PYYAML_VERSION"
          python scripts/check_manifest.py

      - name: Test sync machinery
        run: >-
          uv run --no-project --with "pyyaml==$PYYAML_VERSION"
          python scripts/test_sync.py

      - name: Test tool-version bumper
        run: uv run --no-project python scripts/test_bump_tools.py

      - name: Tool pins are still findable
        # A pin the bumper can't match rots silently. Fail here instead.
        run: uv run --no-project python scripts/bump_tools.py --check

      - name: Test the body linter
        # The rules the whole fleet's pull requests are held to. They ship
        # from here, so they get tested here.
        run: uv run --no-project python scripts/test_lint_body.py

      - name: Test the pre-commit template
        # The hook set every Python repo inherits. Nothing else runs it,
        # since the lint job runs each repo's own config.
        run: >-
          uv run --no-project --with "pyyaml==$PYYAML_VERSION"
          python scripts/test_precommit_template.py

      - name: Test the repo layout check
        run: uv run --no-project python scripts/test_check_repo_layout.py

      - name: Test the AGENTS.md block generator
        run: uv run --no-project python scripts/test_build_agents_block.py

      - name: Verify the AGENTS.md block is current
        # Editing AGENTS.md without regenerating would leave every repo
        # running norms this repo no longer states.
        run: uv run --no-project python scripts/build_agents_block.py --check

      - name: Test the mutation sharding scripts
        # The fixture holds one module, so ci-selftest.yml can only
        # exercise the whole-tree path. These cover the sharded one.
        run: uv run --no-project python scripts/test_mutation_templates.py

      - name: Fixture scripts match the templates they instance
        # ci-selftest.yml runs the family workflow against the fixture. A
        # stale copy here would prove the wrong file works.
        run: |
          for f in tests/fixture-package/scripts/*.py; do
            template="templates/repo/scripts/$(basename "$f")"
            if ! diff -q "$template" "$f" > /dev/null; then
              echo "::error file=$f::Differs from $template. Copy the" \
                   "template over it."
              diff -u "$template" "$f" || true
              exit 1
            fi
          done
          echo "Fixture scripts match their templates."

      - name: Validate brand kit
        # Skips while brand.json is a stub; fails on real drift once
        # branding lands.
        run: uv run --no-project python brand/check.py

      - name: Sync plan is clean
        # Dry-run must at least parse and group the manifest.
        run: >-
          uv run --no-project --with "pyyaml==$PYYAML_VERSION"
          python scripts/sync.py --dry-run --plan-only
