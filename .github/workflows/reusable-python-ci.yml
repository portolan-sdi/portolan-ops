# Shared CI for Python-package repos (rashid, portolan-cli, portolan-registry).
# Callers reference this workflow; the logic changes here, once.
# Distilled from rashid's tests.yml and geoparquet-io's tests.yml, the
# family's best current instances.
#
# The quality floor this workflow enforces:
#   - lint + quality hooks via prek, both commit and pre-push stages
#     (ruff, codespell, actionlint, zizmor, mypy, vulture — the
#     synced .pre-commit-config.yaml defines them)
#   - bandit + pip-audit with expiring ignores (.pip-audit-ignores)
#   - pytest with coverage, Codecov upload (OIDC), and a 90% diff-cover
#     gate on changed lines
#
# Downstream dev-dependency contract: repos in this family declare
# pytest, pytest-cov, pytest-xdist, diff-cover, mypy, vulture,
# bandit, and pip-audit as dev dependencies. The pre-push hooks and the
# security job run them with `uv run` inside the repo's own locked env.
name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions for the test matrix.
        type: string
        default: '["3.11", "3.12", "3.13"]'
      os:
        description: >-
          JSON array of OS names (ubuntu, macos, windows) for schedule,
          push, and dispatch runs. Pull requests use os-pull-request.
        type: string
        default: '["ubuntu", "macos", "windows"]'
      os-pull-request:
        description: >-
          JSON array of OS names for pull requests. Review time runs the
          cheap matrix and the nightly runs the wide one, so a platform
          bug surfaces before release rather than on every push. Keep
          ubuntu in the list: the Codecov upload and the diff-cover gate
          both run there and nowhere else.
        type: string
        default: '["ubuntu"]'
      sync-args:
        description: Extra args for `uv sync` (e.g. "--extra data").
        type: string
        default: ""
      test-command:
        description: >-
          Test command run after `uv sync`. $COVERAGE_TARGET expands to
          the coverage-target input. Keep the coverage flags when
          overriding, or the Codecov and diff-cover steps have nothing
          to read.
        type: string
        default: >-
          uv run pytest -n auto --cov=$COVERAGE_TARGET
          --cov-report=xml --cov-report=term-missing
      coverage-target:
        description: >-
          Package dir measured for coverage (src for src layouts, the
          package name for flat layouts).
        type: string
        default: src
      coverage-python:
        description: >-
          Matrix Python version that uploads to Codecov and runs the
          diff-cover gate. Must appear in python-versions.
        type: string
        default: "3.13"
      bandit-target:
        description: Source dir for bandit; empty skips the security job.
        type: string
        default: src
      working-directory:
        description: >-
          Directory holding pyproject.toml. Jobs run here; the default
          suits normal repos, and ops' own self-test points it at the
          fixture package.
        type: string
        default: "."
      codecov:
        description: >-
          Upload coverage to Codecov. Disable for repos not registered
          on codecov.io (the diff-cover gate still runs).
        type: boolean
        default: true

permissions:
  contents: read

# Org variable is the fleet-wide knob (docs/maintaining-ci.md, "Tool versions").
# The literal is the fallback: `vars` resolves against the *caller's*
# repository, so a fork or an outside caller sees no org variable.
env:
  # renovate: datasource=pypi depName=prek
  PREK_VERSION: ${{ vars.PREK_VERSION || '0.5.11' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        env:
          SYNC_ARGS: ${{ inputs.sync-args }}
        run: |
          uv python install 3.13
          # shellcheck disable=SC2086
          uv sync --locked $SYNC_ARGS

      - name: Run hooks (commit stage)
        run: >-
          uvx prek@"$PREK_VERSION" run --all-files
          --show-diff-on-failure

      - name: Run hooks (pre-push stage)
        # mypy and vulture live here. Running both stages in CI
        # keeps the gate identical for hooked and unhooked clones.
        run: >-
          uvx prek@"$PREK_VERSION" run --all-files
          --hook-stage pre-push --show-diff-on-failure

  security:
    if: inputs.bandit-target != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    # A scheduled failure is a new upstream CVE, not a repo regression.
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        env:
          SYNC_ARGS: ${{ inputs.sync-args }}
        run: |
          uv python install 3.13
          # shellcheck disable=SC2086
          uv sync --locked $SYNC_ARGS

      - name: Run bandit
        env:
          BANDIT_TARGET: ${{ inputs.bandit-target }}
        run: uv run bandit -r "$BANDIT_TARGET" -c pyproject.toml

      - name: Run pip-audit
        # Ignores live in .pip-audit-ignores; entries carry an expiry
        # date and drop out automatically (synced template ships the
        # file and scripts/pip_audit_ignores.py).
        run: |
          IGNORE_ARGS=""
          if [ -f scripts/pip_audit_ignores.py ]; then
            IGNORE_ARGS=$(uv run python scripts/pip_audit_ignores.py)
          fi
          # shellcheck disable=SC2086
          uv run pip-audit $IGNORE_ARGS

  test:
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 20
    defaults:
      run:
        # Every job sets bash. Without it a Windows runner runs each step
        # in pwsh, where "$TEST_COMMAND" names an unset PowerShell
        # variable, and the test step passed with no test run
        # (portolan-ops#132). scripts/check_python_ci_shell.py holds
        # every job to it.
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    permissions:
      contents: read
      # Codecov OIDC upload; no CODECOV_TOKEN secret to fan out.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # github.event_name resolves to the caller's event, so a pull
        # request narrows to os-pull-request and everything else runs the
        # full os list.
        os: >-
          ${{ fromJSON(github.event_name == 'pull_request'
              && inputs.os-pull-request || inputs.os) }}
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so diff-cover can diff against the PR base.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        env:
          SYNC_ARGS: ${{ inputs.sync-args }}
          PY_VERSION: ${{ matrix.python-version }}
        run: |
          uv python install "$PY_VERSION"
          # shellcheck disable=SC2086
          uv sync --locked $SYNC_ARGS

      - name: Run tests
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          COVERAGE_TARGET: ${{ inputs.coverage-target }}
        run: |
          # An empty command runs nothing and exits 0. Fail instead.
          : "${TEST_COMMAND:?test-command is empty, so no test would run}"
          bash -c "$TEST_COMMAND"

      - name: Upload coverage to Codecov
        if: >-
          inputs.codecov &&
          matrix.os == 'ubuntu' &&
          matrix.python-version == inputs.coverage-python
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          working-directory: ${{ inputs.working-directory }}
          files: ./coverage.xml
          use_oidc: true
          # A failed upload is a real failure, not a silent gap.
          fail_ci_if_error: true

      - name: Diff coverage gate (changed lines >= 90% covered)
        if: >-
          github.event_name == 'pull_request' &&
          matrix.os == 'ubuntu' &&
          matrix.python-version == inputs.coverage-python
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          uv run diff-cover coverage.xml
          --compare-branch "origin/$BASE_REF"
          --fail-under=90
