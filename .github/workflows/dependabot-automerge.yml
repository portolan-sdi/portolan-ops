# Ops uses the local reusable workflow. Downstream callers use its v1 release.
name: Dependabot auto-merge

on:
  # Dependabot pull_request runs receive a read-only token. This trusted-base
  # event keeps the requested write permissions. The workflow checks out no
  # pull request code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]

permissions:
  contents: read

jobs:
  dependabot:
    uses: ./.github/workflows/reusable-dependabot-automerge.yml
    permissions:
      contents: write
      pull-requests: write
