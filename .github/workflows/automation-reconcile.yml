# GitHub can disable a workflow without disabling Actions for its repository.
# This job repairs that state and keeps auto-merge enabled across the fleet.
name: Reconcile repository automation

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect active repositories
        id: repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh api --paginate 'orgs/portolan-sdi/repos?per_page=100' \
            --jq '.[] | select(.archived == false) | .name' | paste -sd, -)
          echo "list=$names" >> "$GITHUB_OUTPUT"

      # The list includes new repositories without a manifest edit.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.OPS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_SYNC_APP_KEY }}
          owner: portolan-sdi
          repositories: ${{ steps.repos.outputs.list }}
          permission-actions: write
          permission-administration: write

      - name: Repair disabled automation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/reconcile_repo_automation.py --apply
