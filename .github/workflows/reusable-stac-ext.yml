# Shared CI for STAC extension repos (stac-partition-extension,
# stac-iceberg-extension, stac-osi-extension). Runs the extension test
# suite and, when configured, markdown linting via remark.
name: Reusable STAC extension CI

on:
  workflow_call:
    inputs:
      run-remark:
        description: Lint markdown with the repo's remark config.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - run: npm install

      - run: npm test

      - name: Lint markdown
        if: inputs.run-remark
        run: npx remark . --frail
