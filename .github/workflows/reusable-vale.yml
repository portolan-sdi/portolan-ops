# Shared prose linting for every portolan-sdi repo.
#
# The calling repo supplies the prose. portolan-ops supplies the rules.
# See norms/prose.md for the layers and their reasons.
name: Reusable Vale

on:
  workflow_call:
    inputs:
      ops-ref:
        description: >-
          Ref of portolan-ops to take the rules from. Callers use v1.
          portolan-ops passes its own commit to test rule changes.
        type: string
        default: v1
      fail-on:
        description: >-
          "new-errors" rejects errors added by a pull request. "error"
          rejects every error. "none" only reports findings.
        type: string
        default: new-errors
      paths:
        description: Paths to lint, space separated.
        type: string
        default: .
      messages:
        description: >-
          A next-intl message catalogue to lint as website copy. The
          workflow skips this step when the file is absent.
        type: string
        default: messages/en.json

permissions:
  contents: read

env:
  VALE_VERSION: 3.19.0

jobs:
  vale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate the failure mode
        env:
          FAIL_ON: ${{ inputs.fail-on }}
        run: |
          case "$FAIL_ON" in
            error|new-errors|none) ;;
            *) echo "::error::Unknown fail-on value: $FAIL_ON"; exit 2 ;;
          esac

      - name: Check out the proposed change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      - name: Check out the pull request base
        if: inputs.fail-on == 'new-errors' && github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out the prose rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: portolan-sdi/portolan-ops
          ref: ${{ inputs.ops-ref }}
          path: ops
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Vale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${VALE_VERSION}" \
            --repo vale-cli/vale \
            --pattern "vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            --output vale.tar.gz
          tar xzf vale.tar.gz vale
          sudo install -m 0755 vale /usr/local/bin/vale
          vale --version

      - name: Fetch the pinned style packages
        working-directory: ops
        run: vale sync

      - name: Test the Portolan rules
        if: github.repository == 'portolan-sdi/portolan-ops'
        working-directory: ops
        run: python3 scripts/test_vale_styles.py

      - name: Extract current website copy
        working-directory: repo
        env:
          MESSAGES: ${{ inputs.messages }}
        run: |
          if [ -f "$MESSAGES" ]; then
            python3 ../ops/scripts/vale_messages.py extract "$MESSAGES"
          else
            echo "No $MESSAGES file exists."
          fi

      - name: Extract base website copy
        if: inputs.fail-on == 'new-errors' && github.event_name == 'pull_request'
        working-directory: base
        env:
          MESSAGES: ${{ inputs.messages }}
        run: |
          if [ -f "$MESSAGES" ]; then
            python3 ../ops/scripts/vale_messages.py extract "$MESSAGES"
          else
            echo "No $MESSAGES file exists."
          fi

      - name: Report every Vale alert
        working-directory: repo
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          # shellcheck disable=SC2086
          vale --config ../ops/.vale.ini \
            --minAlertLevel suggestion \
            --output line $PATHS || true

      - name: Map website alerts to message keys
        working-directory: repo
        run: |
          if [ -f .vale-web/messages.map.json ]; then
            vale --config ../ops/.vale.ini \
              --minAlertLevel suggestion \
              --output JSON .vale-web/messages.md \
              | python3 ../ops/scripts/vale_messages.py remap || true
          fi

      - name: Report selected proselint findings
        working-directory: repo
        run: |
          mapfile -d '' files < <(
            git ls-files -z -- '*.md' '*.mdx' \
              ':(exclude).claude/**' \
              ':(exclude)policies/AI_POLICY.md' \
              ':(exclude)policies/CODE_OF_CONDUCT.md' \
              ':(exclude)brand/slidev-addon-portolan/example/slides.md'
          )
          if [ -f .vale-web/messages.md ]; then
            files+=(.vale-web/messages.md)
          fi
          if ((${#files[@]})); then
            uvx --from proselint==0.16.0 proselint check \
              --config ../ops/proselint.json "${files[@]}" || true
          fi

      - name: Gate on every error
        if: inputs.fail-on == 'error'
        working-directory: repo
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          # shellcheck disable=SC2086
          vale --config ../ops/.vale.ini \
            --minAlertLevel error \
            --output line $PATHS

      - name: Capture current errors
        if: inputs.fail-on == 'new-errors' && github.event_name == 'pull_request'
        working-directory: repo
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          # shellcheck disable=SC2086
          vale --config ../ops/.vale.ini \
            --minAlertLevel error \
            --output JSON $PATHS > ../current-vale.json || true

      - name: Capture base errors
        if: inputs.fail-on == 'new-errors' && github.event_name == 'pull_request'
        working-directory: base
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          # shellcheck disable=SC2086
          vale --config ../ops/.vale.ini \
            --minAlertLevel error \
            --output JSON $PATHS > ../base-vale.json || true

      - name: Reject new errors
        if: inputs.fail-on == 'new-errors' && github.event_name == 'pull_request'
        run: >-
          python3 ops/scripts/compare_vale.py
          base-vale.json current-vale.json
