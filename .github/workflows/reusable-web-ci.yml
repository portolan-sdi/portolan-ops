# Shared CI for web-app repos (portolan-sdi.org, portolan-browser,
# portolan-nl-demo). Lint plus unit tests; app-specific suites (e2e,
# deploys) stay in each repo's own workflows.
name: Reusable web CI

on:
  workflow_call:
    inputs:
      package-manager:
        description: pnpm or npm.
        type: string
        default: pnpm
      lint-command:
        type: string
        default: run lint
      test-command:
        description: Unit test command; empty skips the test job.
        type: string
        default: run test:unit

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.package-manager == 'pnpm'
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          if [ "$PM" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Lint
        env:
          PM: ${{ inputs.package-manager }}
          LINT_COMMAND: ${{ inputs.lint-command }}
        run: bash -c "$PM $LINT_COMMAND"

  test:
    if: inputs.test-command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.package-manager == 'pnpm'
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          if [ "$PM" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Unit tests
        env:
          PM: ${{ inputs.package-manager }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -c "$PM $TEST_COMMAND"
