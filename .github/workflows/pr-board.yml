# This repo runs the rule it ships. Unlike downstream callers it points at
# the local workflow, so a change to the rule is exercised by the pull
# request that makes it.
name: Pull request board

on:
  # See ci/pr-board.yml for why this trigger is pull_request_target. This
  # workflow checks out nothing and runs no code from the pull request.
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, no PR code runs
    types: [opened, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  board:
    uses: ./.github/workflows/reusable-pr-board.yml
    permissions:
      contents: read
    secrets:
      # Named rather than inherited: the called workflow needs these two and
      # nothing else, and an unconditional inherit hands it every secret the
      # repo holds.
      OPS_SYNC_APP_CLIENT_ID: ${{ secrets.OPS_SYNC_APP_CLIENT_ID }}
      OPS_SYNC_APP_KEY: ${{ secrets.OPS_SYNC_APP_KEY }}
